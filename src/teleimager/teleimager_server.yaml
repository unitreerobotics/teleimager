# =====================================================
# TeleImager server configuration Default Template
#
# On first run the server copies this file to ~/.config/teleimager/teleimager_server.yaml;
# fill in that copy according to your camera discovery results (teleimager-server --cf).
# The server reads from that path by default; override it with --config <path>.
# =====================================================

# =====================================================
# Global WebRTC encoder config (applies to ALL cameras).
# Tune by network: WiFi6 5GHz dedicated -> max ~12M; WiFi5 shared -> max ~8M; public -> max ~4M.
# =====================================================
webrtc:
  bitrate:
    min: 2000000      # floor under congestion
    default: 5000000  # startup rate, skips slow-start
    max: 12000000     # quality ceiling on healthy network
  gop_length: null    # keyframe interval in FRAMES; null = 2 seconds (2 x camera fps)

# =====================================================
# Cameras. Each entry below `camera:` is one camera topic.
# Type of camera:
#   - "uvc"       -> pyuvc driver (Python binding for libuvc; USB UVC)
#   - "v4l2"      -> PyAV (libav v4l2) JPEG-first driver: MJPG passthrough, YUYV fallback decode
#   - "gstreamer" -> GStreamer (gi) appsink driver, intended for GMSL / MIPI CSI and
#                   other non-USB cameras. For USB cameras prefer "uvc" or "v4l2".
#                   Build gst_pipeline with AI assistance. It must end with
#                   image/jpeg ! appsink name=sink; add videoconvert ! jpegenc
#                   (or a hardware JPEG encoder) for raw sources.
#   - "realsense" -> pyrealsense2 driver
#
# Camera identifiers (choose one or more), listed in priority order:
#   - physical_path -> sysfs physical USB path (e.g. "/sys/devices/pci0000:00/.../1-11.2:1.0")
#   - serial_number -> camera's hardware serial (e.g. "141722079879")
#   - bcd_device    -> USB device release number (e.g. "0100")
#   - vid_pid       -> USB vendor:product ID (e.g. "1c45:6200")
#   - video_id      -> /dev/videoX  (e.g. 0 -> /dev/video0)
#
# IMPORTANT: All string identifiers (serial_number, bcd_device, vid_pid, physical_path)
#   MUST be quoted in YAML. Without quotes, values with leading zeros (e.g. 0217)
#   are parsed as octal integers, and long digit-only serial numbers may lose
#   precision.  Only video_id is a plain integer.
#
# Identifier priority:
#   physical_path > serial_number > bcd_device > vid_pid > video_id
#   if an identifier is not used, set it to null. The system will resolve the camera by priority.
#   - driver_type "realsense":  uses serial_number
#   - driver_type "v4l2"/"uvc": use the USB identifier ladder
#   - driver_type "gstreamer":  ignores all identifier keys; uses gst_pipeline instead
# =====================================================
camera:

  # =====================================================
  # Head camera configuration
  # =====================================================
  head_camera:                  # camera topic name (user-defined)
    # ---- common keys ----
    driver_type: v4l2      # camera driver type: "uvc", "v4l2", "gstreamer", "realsense"
    image_shape: [480, 1280]    # image resolution: [height, width]; binocular = side-by-side composite
    binocular: true             # if true, the camera is binocular (side-by-side stereo), false if monocular
    fps: 30                     # frame per second; color and depth share it

    # ---- ZMQ streams (color + depth) ----
    # if enable_color_zmq / enable_depth_zmq / enable_webrtc are all false, the camera will not start
    enable_color_zmq: true      # Set to true to publish the color stream over ZMQ
    color_zmq_port: 55555       # Color port, e.g. zmq tcp://*:55555; client.py connects to the same port
    enable_depth_zmq: false     # realsense only: capture and publish the depth stream
    depth_zmq_port: 56001       # Depth port (header + zstd); required only when enable_depth_zmq is true

    # ---- WebRTC (color only) ----
    enable_webrtc: true         # Set to true to enable WebRTC publishing, false to disable
    webrtc_port: 60001         # Port for WebRTC signaling server
    webrtc_codec: h264          # webrtc codec preference, options: "vp8", "h264"

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: null
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: null
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: null

  # =====================================================
  # Left wrist camera configuration
  # =====================================================
  left_wrist_camera:                  # camera topic name (user-defined)
    # ---- common keys ----
    driver_type: uvc      # camera driver type: "uvc", "v4l2", "gstreamer", "realsense"
    image_shape: [480, 640]    # image resolution: [height, width]; binocular = side-by-side composite
    binocular: false             # if true, the camera is binocular (side-by-side stereo), false if monocular
    fps: 30                     # frame per second; color and depth share it

    # ---- ZMQ streams (color + depth) ----
    # if enable_color_zmq / enable_depth_zmq / enable_webrtc are all false, the camera will not start
    enable_color_zmq: true      # Set to true to publish the color stream over ZMQ
    color_zmq_port: 55556       # Color port, e.g. zmq tcp://*:55556; client.py connects to the same port
    enable_depth_zmq: false     # realsense only: capture and publish the depth stream
    depth_zmq_port: 56002       # Depth port (header + zstd); required only when enable_depth_zmq is true

    # ---- WebRTC (color only) ----
    enable_webrtc: true         # Set to true to enable WebRTC publishing, false to disable
    webrtc_port: 60002         # Port for WebRTC signaling server
    webrtc_codec: h264          # webrtc codec preference, options: "vp8", "h264"

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: null
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: null
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: null

  # =====================================================
  # Right wrist camera configuration
  # =====================================================
  right_wrist_camera:                  # camera topic name (user-defined)
    # ---- common keys ----
    driver_type: gstreamer      # camera driver type: "uvc", "v4l2", "gstreamer", "realsense"
    image_shape: [480, 640]    # image resolution: [height, width]; binocular = side-by-side composite
    binocular: false             # if true, the camera is binocular (side-by-side stereo), false if monocular
    fps: 30                     # frame per second; color and depth share it

    # ---- ZMQ streams (color + depth) ----
    # if enable_color_zmq / enable_depth_zmq / enable_webrtc are all false, the camera will not start
    enable_color_zmq: false      # Set to true to publish the color stream over ZMQ
    color_zmq_port: 55557       # Color port, e.g. zmq tcp://*:55557; client.py connects to the same port
    enable_depth_zmq: false     # realsense only: capture and publish the depth stream
    depth_zmq_port: 56003       # Depth port (header + zstd); required only when enable_depth_zmq is true

    # ---- WebRTC (color only) ----
    enable_webrtc: false         # Set to true to enable WebRTC publishing, false to disable
    webrtc_port: 60003         # Port for WebRTC signaling server
    webrtc_codec: h264          # webrtc codec preference, options: "vp8", "h264"

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: null
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: null
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: null
