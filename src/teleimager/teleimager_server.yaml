# =====================================================
# Global WebRTC encoder config (applies to ALL cameras).
# aiortc bitrate caps are module-level, so this is shared by every track.
# Tune by network: WiFi6 5GHz dedicated -> max ~12M; WiFi5 shared -> max ~8M; public -> max ~4M.
# =====================================================
webrtc:
  bitrate:
    min: 2000000      # floor under congestion
    default: 5000000  # startup rate, skips slow-start
    max: 12000000     # quality ceiling on healthy network
  gop_length: 60      # frames between keyframes; lower = faster recovery from packet loss

# =====================================================
# Cameras. Each entry below `camera:` is one camera topic.
# Keys are grouped: common keys first (shared by every driver), then
# driver-specific keys after. Set unused keys to null.
#
# Type of camera:
#   - "uvc"       → pyuvc driver (Python binding for libuvc; USB UVC)
#   - "v4l2"      → PyAV (libav v4l2) JPEG-first driver: MJPG passthrough, YUYV fallback decode
#   - "gstreamer" → GStreamer (gi) appsink driver; user supplies a full gst_pipeline (USB / GMSL / MIPI CSI)
#   - "realsense" → pyrealsense2 driver
#
# Camera identifiers (choose one or more), listed in priority order:
#   - physical_path → sysfs physical USB path (e.g. "/sys/devices/pci0000:00/.../1-11.2:1.0")
#   - serial_number → camera's hardware serial (e.g. "141722079879")
#   - bcd_device    → USB device release number (e.g. "0100")
#   - vid_pid       → USB vendor:product ID (e.g. "1c45:6200")
#   - video_id      → /dev/videoX  (e.g. 0 → /dev/video0)
#
# IMPORTANT: All string identifiers (serial_number, bcd_device, vid_pid, physical_path)
#   MUST be quoted in YAML. Without quotes, values with leading zeros (e.g. 0217)
#   are parsed as octal integers, and long digit-only serial numbers may lose
#   precision.  Only video_id is a plain integer.
#
# Identifier priority:
#   physical_path > serial_number > bcd_device > vid_pid > video_id
#   if an identifier is not used, set it to null. The system will resolve the camera by priority.
#   - type "realsense":  uses serial_number
#   - type "v4l2"/"uvc": use the USB identifier ladder
#   - type "gstreamer":  ignores all identifier keys; uses gst_pipeline instead
# =====================================================
camera:

  # =====================================================
  # Head camera configuration
  # =====================================================
  head_camera:                  # camera topic name (user-defined)
    # ---- common keys ----
    # if enable_zmq and enable_webrtc are both false, the camera will not start
    enable_zmq: true            # Set to true to enable ZMQ publishing, false to disable
    zmq_port : 55555            # Port to publish camera stream, e.g. zmq tcp://*:55555. client.py connects to the same port
    enable_webrtc: true         # Set to true to enable WebRTC publishing, false to disable
    webrtc_port : 60001         # Port for WebRTC signaling server
    webrtc_codec: h264          # webrtc codec preference, options: "vp8", "h264"
    type: gstreamer             # camera driver type: "uvc", "v4l2", "gstreamer", "realsense"
    image_shape: [480, 1280]    # image resolution: [height, width]
    binocular: true             # if true, the camera is binocular (side-by-side stereo), false if monocular
    fps: 30                     # frame per second

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: null
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: null
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: "v4l2src device=/dev/video0 ! image/jpeg ! appsink name=sink"

  # =====================================================
  # Left wrist camera configuration
  # =====================================================
  left_wrist_camera:
    # ---- common keys ----
    enable_zmq: true
    zmq_port : 55556
    enable_webrtc: true
    webrtc_port : 60002
    webrtc_codec: h264
    type: uvc
    image_shape: [480, 640]
    binocular: false
    fps: 30

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: "200901010001"
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: null
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: null

  # =====================================================
  # Right wrist camera configuration
  # =====================================================
  right_wrist_camera:
    # ---- common keys ----
    enable_zmq: false
    zmq_port : 55557
    enable_webrtc: false
    webrtc_port: 60003
    webrtc_codec: h264
    type: v4l2
    image_shape: [480, 640]
    binocular: false
    fps: 30

    # ---- driver-specific keys ----
    # common identifier (uvc / v4l2 / realsense)
    serial_number: null
    # uvc / v4l2 only (USB identifiers)
    physical_path: null
    bcd_device: "0217"
    vid_pid: null
    video_id: null
    # gstreamer only
    gst_pipeline: null
